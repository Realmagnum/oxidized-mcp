[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxidized-mcp"
version = "0.2.0"
description = "Read-only MCP server for structured search over Oxidized network configuration backups"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "magnum", email = "magnum@khamidulin.ru"}]
keywords = ["mcp", "oxidized", "network-config", "dlink", "eltex", "snr"]
dependencies = [
  "mcp>=2.1,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "build>=1.2,<2",
]

[project.scripts]
oxidized-mcp = "oxidized_mcp.server:main"

[project.urls]
Repository = "https://gitea.rmg7.com/agent/oxidized-mcp"
Specification = "https://gitea.rmg7.com/agent/oxidized-mcp/src/branch/main/SPEC.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oxidized_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.bandit]
skips = ["B101"]
