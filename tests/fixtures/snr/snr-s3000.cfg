# Sample SNR S3000 configuration for testing

hostname snr-s3000-sw-02
ip address 10.0.0.21 255.255.255.0
ip default-gateway 10.0.0.254

# VLAN configuration
interface vlan 100
name DATA
exit

interface vlan 200
name VOICE
exit

interface vlan 300
name MGMT
exit

interface vlan 400
name CCTV
exit

# Interface configuration
interface gigabitethernet 0/1
description "Uplink"
switchport mode trunk
switchport trunk allowed vlan 100,200,300,400

interface gigabitethernet 0/2
description "Access port"
switchport mode access
switchport access vlan 100

interface gigabitethernet 0/3
description "IP phone"
switchport mode access
switchport access vlan 200
voice vlan 200

# ACL configuration
ip access-list standard ACL-100
permit 10.0.0.0 0.0.0.255
deny 192.168.0.0 0.0.0.255

# NTP configuration
ntp server 10.0.0.100
ntp server 10.0.0.101
ntp source interface Loopback0

# SNMP configuration
snmp-server community public RO
snmp-server community private RW
snmp-server host 10.0.0.200 public
snmp-server version v2c

# LLDP configuration
lldp enable
lldp timer 30
lldp holdtime 4

# SSH configuration
ssh server enable
ssh server port 22
ssh server version 2
login allowed-user admin