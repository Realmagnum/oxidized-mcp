# Sample D-Link DGS-3630 configuration for testing

hostname dgs-3630-sw-02
ip address 10.0.0.2 255.255.255.0
ip default-gateway 10.0.0.254

# VLAN configuration
create vlan 100 name "DATA" on port 1,2,3,4
create vlan 200 name "VOICE" on port 5,6
create vlan 300 name "MGMT" on port 7

# ACL configuration
ip access-list advanced ACL-VLAN100
permit ip 10.0.0.0/24 10.1.0.0/16
deny ip 10.0.0.0/24 192.168.0.0/16

# NTP configuration
ntp server 10.0.0.100
ntp server 10.0.0.101
ntp source vlan 300

# SNMP configuration
snmp-server community public RO
snmp-server community private RW
snmp version v2c

# Interface configuration
interface gigabitethernet 1/0/1
description "Uplink"
speed 1000M
link-mode trunk
tagged-port 100,200,300

interface gigabitethernet 1/0/2
description "Access port"
speed 100M
link-mode access
untagged-port 100

# LLDP configuration
lldp enable
lldp timer 30
lldp holdtime 4

# Static MAC configuration
static mac aa:bb:cc:dd:ee:ff vlan 100 interface gigabitethernet 1/0/2

# Voice VLAN configuration
voice-vlan 200 auto

# SSH configuration
ssh server enable
ssh server port 22
ssh server version 2
login allowed-user admin
ssh pubkey-auth enable