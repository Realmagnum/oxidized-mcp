# Sample D-Link DES-3200 configuration for testing
# This is a simplified example; real configs will be provided by the user

hostname des-3200-sw-01
ip address 10.0.0.1 255.255.255.0
ip default-gateway 10.0.0.254

# VLAN configuration
create vlan 100 name "VLAN100" on port 1,2,3
create vlan 200 name "VLAN200" on port 4,5
create vlan 100 name "VLAN100" on port 6

# ACL configuration
access-list 101 inbound
permit ip 10.0.0.0/24 any
deny ip 192.168.0.0/16 any

# NTP configuration
ntp server 10.0.0.100
ntp source vlan 100

# SNMP configuration
snmp-server community public RO
snmp-server host 10.0.0.200 public
snmp-server community private RW

# Interface configuration
interface port 1
description "Uplink to core"
speed 1000M
link-mode trunk

interface port 2
description "Access port"
speed 100M
link-mode access

# LLDP configuration
lldp enable
lldp timer 30
lldp holdtime 4

# Static MAC configuration
static mac 00:11:22:33:44:55 vlan 100 interface port 1

# Voice VLAN configuration
voice-vlan 100 auto

# SSH configuration
ssh server enable
ssh server port 22
ssh server version 2
login allowed-user admin